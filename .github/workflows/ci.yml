name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CE_ROM_OBJECT: ti84pce/ce.rom.gpg

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned versions
        id: versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          pip install "clang-format==${{ steps.versions.outputs.CLANG_FORMAT_VERSION }}"

      - name: Check formatting, static analysis and scripts
        run: make lint

      - name: Lint workflows
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${{ steps.versions.outputs.ACTIONLINT_VERSION }}/scripts/download-actionlint.bash") "${{ steps.versions.outputs.ACTIONLINT_VERSION }}"
          ./actionlint -color

  abi:
    name: ABI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare exports with the previous release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            base=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          else
            base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          fi
          make abi-check ABI_BASE="$base"

  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc, ASan + UBSan
            cc: gcc
            cflags: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: clang, ASan + UBSan
            cc: clang
            cflags: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: gcc, -O2
            cc: gcc
            cflags: -O2
          - name: clang, -O2
            cc: clang
            cflags: -O2
          - name: gcc, 32-bit
            cc: gcc
            cflags: -O2 -m32
            packages: gcc-multilib
    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Run unit tests
        run: make test HOST_CC=${{ matrix.cc }} HOST_CFLAGS="${{ matrix.cflags }}"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned versions
        id: versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install gcovr
        run: pip install "gcovr==${{ steps.versions.outputs.GCOVR_VERSION }}"

      - name: Measure coverage
        run: make coverage HOST_CC=gcc

      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage of src/"
            echo
            cat obj/coverage/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: obj/coverage/*.html
          if-no-files-found: error

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parser, url, misc]
    steps:
      - uses: actions/checkout@v7

      - name: Load pinned versions
        id: versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: obj/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz for ${{ steps.versions.outputs.FUZZ_SECONDS }} seconds
        run: make fuzz-${{ matrix.target }} FUZZ_CC=clang FUZZ_SECONDS=${{ steps.versions.outputs.FUZZ_SECONDS }}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: obj/fuzz/${{ matrix.target }}-*
          if-no-files-found: ignore

  build:
    name: Build (CE toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-cedev

      - name: Check exports against the header
        run: make exports

      - name: Build library and check size budget
        run: make size-check

      - name: Build examples and HTTPTEST
        run: |
          make examples
          make httptest

      - name: Package release archive
        run: make package

      - name: Publish build summary
        run: |
          {
            echo "## Build"
            echo
            echo "| file | bytes |"
            echo "| --- | --- |"
            for f in bin/LWHTTP.8xv bin/LWHTTP.lib examples/*/bin/*.8xp tests/device/bin/HTTPTEST.8xp release/*.zip; do
              echo "| \`$f\` | $(wc -c < "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lwhttp-build
          path: |
            bin/LWHTTP.8xv
            bin/LWHTTP.lib
            lwhttp.h
            LICENSE
            release/*.zip
            examples/*/bin/*.8xp
            tests/device/bin/HTTPTEST.8xp
          if-no-files-found: error

  emulator:
    name: Emulator tests (CEmu, ${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [full, extended]
    steps:
      - uses: actions/checkout@v7

      - name: Check for ROM secrets
        id: rom
        env:
          CE_ROM_KEY: ${{ secrets.CE_ROM_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$CE_ROM_KEY" ] && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator tests skipped::Set CE_ROM_KEY and the R2_* secrets to run HTTPTEST on CEmu."
          fi

      - name: Load pinned versions
        if: steps.rom.outputs.available == 'true'
        id: versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-cedev
        if: steps.rom.outputs.available == 'true'
        id: cedev

      - uses: alessiodam/cemu-net-action@v1
        if: steps.rom.outputs.available == 'true'
        id: cemu
        with:
          truststore: true

      - name: Fetch ROM and CE libraries
        if: steps.rom.outputs.available == 'true'
        env:
          CE_ROM_KEY: ${{ secrets.CE_ROM_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS --retry 3 --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
            -o "$RUNNER_TEMP/ce.rom.gpg" -w '%{http_code}' \
            "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_BUCKET/${{ env.CE_ROM_OBJECT }}")
          if [ "$status" != 200 ]; then
            echo "::error title=ROM download failed::HTTP $status"
            head -c 600 "$RUNNER_TEMP/ce.rom.gpg" | tr -cd '[:print:]\n' | sed 's/^/  /'
            exit 1
          fi
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$CE_ROM_KEY" \
            --output "$RUNNER_TEMP/ce.rom" --decrypt "$RUNNER_TEMP/ce.rom.gpg"
          rm -f "$RUNNER_TEMP/ce.rom.gpg"
          gh release download "${{ steps.versions.outputs.CLIBS_REF }}" --repo CE-Programming/libraries \
            --pattern clibs.8xg --dir "$RUNNER_TEMP"

      - name: Run HTTPTEST on CEmu
        if: steps.rom.outputs.available == 'true'
        run: |
          make emulator-test \
            HTTPTEST_MODE=${{ matrix.mode }} \
            LWIP_DIST="${{ steps.cedev.outputs.lwip-dist }}" \
            CLIBS="$RUNNER_TEMP/clibs.8xg" \
            TRUSTSTORE="${{ steps.cemu.outputs.truststore }}" \
            USB_STEP="${{ steps.cemu.outputs.usb-step }}" \
            CEMU_AUTOTESTER="${{ steps.cemu.outputs.autotester }}" \
            AUTOTESTER_ROM="$RUNNER_TEMP/ce.rom"

      - name: Remove ROM
        if: always() && steps.rom.outputs.available == 'true'
        run: shred -u "$RUNNER_TEMP/ce.rom" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always() && steps.rom.outputs.available == 'true'
        with:
          name: httptest-emulator-log-${{ matrix.mode }}
          path: tests/device/HTTPLOG.8xv
          if-no-files-found: ignore
